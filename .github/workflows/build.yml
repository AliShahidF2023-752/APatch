name: Build Manager

on:
  push:
    tags: [ "*" ]
    branches: [ "main" ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'apd/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'apd/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
  workflow_call:
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: parse_version
        run: |
          COMMIT_NUM=$(git rev-list --count HEAD)
          VERSION=$(echo "$COMMIT_NUM + 200 + 10000" | bc)
          echo "Generated Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install toolchain
        run: |
          rustup default stable
          rustup update stable
          cargo install cargo-ndk
          rustup target install aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apd
          cache-targets: false

      - name: Build with Gradle
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.vfs.watch=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties
          ./gradlew clean assembleDebug assembleRelease

      - name: Generate auto keystore
        id: auto_keystore
        run: |
          AUTO_KEYSTORE=$RUNNER_TEMP/auto-release-key.jks
          keytool -genkeypair \
            -keystore "$AUTO_KEYSTORE" \
            -alias      release-key \
            -keyalg     RSA \
            -keysize    2048 \
            -validity   10000 \
            -storepass  release1234 \
            -keypass    release1234 \
            -dname      "CN=Release Build, OU=CI, O=GitHub Actions, L=Unknown, ST=Unknown, C=US"
          echo "AUTO_KEYSTORE=$AUTO_KEYSTORE" >> $GITHUB_OUTPUT
          B64=$(base64 -w 0 "$AUTO_KEYSTORE")
          echo "AUTO_KEY_B64=$B64" >> $GITHUB_OUTPUT

      - name: Sign Release APK
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY != '' && secrets.SIGNING_KEY || steps.auto_keystore.outputs.AUTO_KEY_B64 }}
          alias: ${{ secrets.SIGNING_KEY != '' && secrets.ALIAS || 'release-key' }}
          keyStorePassword: ${{ secrets.SIGNING_KEY != '' && secrets.KEY_STORE_PASSWORD || 'release1234' }}
          keyPassword: ${{ secrets.SIGNING_KEY != '' && secrets.KEY_PASSWORD || 'release1234' }}
          zipAlign: true

      - name: Sign Debug APK
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_debug_app
        with:
          releaseDirectory: app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.SIGNING_KEY != '' && secrets.SIGNING_KEY || steps.auto_keystore.outputs.AUTO_KEY_B64 }}
          alias: ${{ secrets.SIGNING_KEY != '' && secrets.ALIAS || 'release-key' }}
          keyStorePassword: ${{ secrets.SIGNING_KEY != '' && secrets.KEY_STORE_PASSWORD || 'release1234' }}
          keyPassword: ${{ secrets.SIGNING_KEY != '' && secrets.KEY_PASSWORD || 'release1234' }}
          zipAlign: true

      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: APatch-Release
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: APatch-Debug
          path: ${{ steps.sign_debug_app.outputs.signedReleaseFile }}

      - name: Post to channel
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          if [ -n "${BOT_TOKEN}" ]; then
            CHANNELS=(-1002058433411 -1001910818234)
            RELEASE_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
            DEBUG_APK="${{ steps.sign_debug_app.outputs.signedReleaseFile }}"
            for CHANNEL in "${CHANNELS[@]}"; do
              URL=$(python3 .github/scripts/telegram_url.py $CHANNEL)
              if [ -f "$RELEASE_APK" ] && [ -f "$DEBUG_APK" ]; then
                curl -v "$URL" -F "Release1=@$RELEASE_APK" -F "Release2=@$DEBUG_APK"
              fi
            done
          fi

      - name: Release APK
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ steps.parse_version.outputs.VERSION }}
          artifacts: ${{ steps.sign_app.outputs.signedReleaseFile }}
          generateReleaseNotes: true
          makeLatest: true
          replacesArtifacts: true
